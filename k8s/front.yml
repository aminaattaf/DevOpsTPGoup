apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-deployment
  namespace: val
  labels:
    app: tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: front
  template:
    metadata:
      labels:
        app: front
    spec:
      containers:
      - name: front-container
        image: aminachakira/devopstp:frontend
        ports:
        - containerPort: 80
        env:
        - name: API_URL
          value: "http://back-service:8080"