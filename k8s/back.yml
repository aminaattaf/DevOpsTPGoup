apiVersion: apps/v1
kind: Deployment
metadata:
  name: back-deployment
  namespace: val
  labels:
    app: tp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: back
  template:
    metadata:
      labels:
        app: back
    spec:
      containers:
      - name: back-container
        image: aminachakira/devopstp:backend
        ports:
        - containerPort: 80