apiVersion: v1
kind: Service
metadata:
  name: db-service
  namespace: val
spec:
  type: ClusterIP
  selector:
    app: database
  ports:
    - port: 3306
      targetPort: 3306
---

apiVersion: v1
kind: Service
metadata:
  name: back-service
  namespace: val
spec:
  type: ClusterIP
  selector:
    app: back
  ports:
    - port: 8080
      targetPort: 8080
---

apiVersion: v1
kind: Service
metadata:
  name: front-service
  namespace: val
spec:
  type: NodePort
  selector:
    app: front
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080